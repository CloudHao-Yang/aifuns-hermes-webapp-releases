{"name":"Publish verified renderer","on":{"workflow_dispatch":{}},"permissions":{},"jobs":{"release":{"runs-on":"ubuntu-24.04","timeout-minutes":20,"permissions":{"contents":"write"},"env":{"C":"2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19","TAG":"webapp-2bd378ed1b8d"},"steps":[{"uses":"actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020","with":{"node-version":"26.12.1"}},{"name":"Build only public upstream code","shell":"bash","run":"set -euo pipefail; git init -q src; git -C src fetch --depth=1 https://github.com/NousResearch/hermes-agent.git $C; git -C src checkout -q --detach FETCH_HEAD; cd src; test $(git rev-parse HEAD) = $C; node apps/desktop/scripts/build-webapp.mjs"},{"name":"Check assets and collect redistribution notices","shell":"bash","run":"set -euo pipefail; root=$PWD; cd src; d=apps/desktop/dist-webapp; test -s $d/index.html; test -s $d/renderer-manifest.json; test -z \"$(find $d -type l -print -quit)\"; test -z \"$(find $d -type f \\( -name '.env*' -o -name '*.pem' -o -name '*.key' -o -name '*.db' -o -name 'auth.json' -o -name 'config.yaml' \\) -print -quit)\"; jq -er '.[] | (.file,.css[]?,.assets[]?)' $d/renderer-manifest.json | while IFS= read -r f; do test -f \"$d/$f\"; done; n=$PWD/$d/THIRD-PARTY-NOTICES; mkdir -p $n; cp LICENSE $d/LICENSE; cp apps/desktop/src/plugins/hermes-bots/LICENSE $n/hermes-bots-LICENSE; curl -fsSL https://raw.githubusercontent.com/JetBrains/JetBrainsMono/master/OFL.txt -o $n/JetBrainsMono-OFL.txt; cp package-lock.json $n/npm-lock.json; jq -r '.packages | to_entries[] | select(.value.version!=null) | [.key,.value.version,(.value.license // \"see package source\"),(.value.resolved // \"upstream workspace\")] | @tsv' package-lock.json > $n/dependency-sources.tsv; w=.build/webapp-workspace; test -d $w/node_modules; (cd $w && find node_modules -type f \\( -iname 'license*' -o -iname 'licence*' -o -iname 'notice*' -o -iname 'copying*' -o -iname 'ofl.txt' \\) -size -2M -exec cp --parents -t $n -- {} +); test -f $n/node_modules/react/LICENSE; printf 'Unofficial distribution of NousResearch/hermes-agent. Exact upstream source: https://github.com/NousResearch/hermes-agent/tree/%s . Third-party licensing and source distribution URLs: THIRD-PARTY-NOTICES/dependency-sources.tsv and npm-lock.json. No customer configuration included.\n' $C > $d/DISTRIBUTION.txt; mkdir $root/out $root/check; a=hermes-webapp-$C.tar.gz; tar -C $d -czf $root/out/$a .; tar -C $root/check -xzf $root/out/$a; diff -qr $d $root/check; cd $root/out; sha256sum $a > SHA256SUMS; sha256sum -c SHA256SUMS; cp ../src/LICENSE LICENSE.txt; printf 'source=https://github.com/NousResearch/hermes-agent.git\\ncommit=%s\\nnode=%s\\nnpm=%s\\nrun=%s\\n' $C $(node -v) $(npm -v) $GITHUB_RUN_ID > build-info.txt"},{"name":"Publish immutable version name (do not replace an existing release)","env":{"GH_TOKEN":"${{ github.token }}"},"shell":"bash","run":"set -euo pipefail; gh release create $TAG --repo $GITHUB_REPOSITORY --target $GITHUB_SHA --title 'Hermes Webapp v0.23.0 (2bd378ed1b8d)' --notes 'Unofficial prebuilt browser renderer. Requires the matching upstream commit. Download the tar.gz and SHA256SUMS; run sha256sum -c SHA256SUMS before installation. Upstream and third-party notices are included.' out/*"}]}}}
